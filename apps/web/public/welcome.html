<!doctype html>
<!-- Yuika Desktop onboarding (P2-DTL-1, D47). Vanilla (tanpa React): halaman
     ini dibuka shell Tauri sebagai window pertama (apps/desktop). window
     .__TAURI__ di-inject shell (withGlobalTauri). Dibuka di browser biasa →
     fallback link ke app. Copy ENGLISH (aturan UI). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome to Yuika</title>
    <style>
      :root {
        --canvas: #1a1a1a;
        --surface: #212121;
        --inset: #101010;
        --line: #2e2e2e;
        --line-strong: #3d3d3d;
        --primary: #f2f2f2;
        --muted: #9a9a9a;
        --dim: #7a7a7a;
        --accent: #007cf7;
        --accent-hover: #3394f9;
        --danger: #ff6069;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--canvas);
        color: var(--primary);
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 32px;
      }
      .wrap { width: 100%; max-width: 560px; }
      header { text-align: center; margin-bottom: 28px; }
      .mark {
        width: 40px; height: 40px; margin: 0 auto 12px;
        border-radius: 999px;
        background: radial-gradient(circle at 34% 30%, #4da3ff, var(--accent) 62%);
        box-shadow: 0 6px 24px -6px rgb(0 124 247 / 0.45);
      }
      h1 { font-size: 18px; font-weight: 600; }
      .sub { color: var(--muted); margin-top: 4px; }
      .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      @media (max-width: 520px) { .cards { grid-template-columns: 1fr; } }
      .card {
        display: flex; flex-direction: column; gap: 6px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px;
        cursor: pointer;
        transition: border-color 120ms ease, background 120ms ease;
        text-align: left;
        font: inherit;
        color: inherit;
      }
      .card:hover { border-color: var(--accent); }
      .card b { font-size: 13px; font-weight: 600; }
      .card span { color: var(--muted); font-size: 12px; }
      .card .go { color: var(--accent); font-size: 12px; margin-top: 6px; }
      .remote {
        display: none;
        margin-top: 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
      }
      .remote.open { display: block; }
      .remote label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
      .row { display: flex; gap: 8px; }
      input {
        flex: 1;
        background: var(--inset);
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        color: var(--primary);
        font: inherit;
        padding: 7px 10px;
        outline: none;
        min-width: 0;
      }
      input:focus { border-color: var(--accent); }
      button.primary {
        background: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 8px;
        color: #fff;
        font: inherit;
        font-weight: 500;
        padding: 7px 14px;
        cursor: pointer;
      }
      button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
      .status { text-align: center; color: var(--muted); font-size: 12px; margin-top: 16px; min-height: 16px; }
      .status.err { color: var(--danger); }
      .fallback {
        display: none;
        text-align: center;
        margin-top: 16px;
        color: var(--dim);
        font-size: 12px;
      }
      .fallback a { color: var(--accent); text-decoration: none; }
      .fallback a:hover { text-decoration: underline; }
      body.plain .fallback { display: block; }
      body.plain .cards, body.plain .remote { display: none; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header>
        <div class="mark" aria-hidden="true"></div>
        <h1>Welcome to Yuika</h1>
        <p class="sub">Your agentic persona studio. How do you want to run it?</p>
      </header>

      <div class="cards">
        <button class="card" id="btnHost" type="button">
          <b>On this device</b>
          <span>Run the full studio locally: engine, projects, and workspace on this machine.</span>
          <span class="go">Start local engine →</span>
        </button>
        <button class="card" id="btnRemote" type="button">
          <b>Connect to a host</b>
          <span>Drive a Yuika instance running on another machine from here.</span>
          <span class="go">Enter host URL →</span>
        </button>
      </div>

      <form class="remote" id="remoteBox" autocomplete="off">
        <label for="hostUrl">Host URL (for example http://192.168.1.20:3000)</label>
        <div class="row">
          <input id="hostUrl" type="url" placeholder="http://" spellcheck="false" />
          <button class="primary" type="submit">Connect</button>
        </div>
      </form>

      <p class="status" id="status" role="status"></p>
      <p class="fallback">
        You opened this page in a browser. Launch the Yuika desktop app to pick a mode, or
        <a href="./">continue in the browser</a>.
      </p>
    </main>

    <script>
      const status = document.getElementById("status");
      const setStatus = (msg, err) => {
        status.textContent = msg;
        status.classList.toggle("err", !!err);
      };
      window.__hostError = (msg) => setStatus(msg, true);

      const tauri = window.__TAURI__;
      if (!tauri) document.body.classList.add("plain");

      document.getElementById("btnHost").addEventListener("click", () => {
        if (!tauri) return;
        setStatus("Starting the local engine…");
        tauri.core.invoke("pick_host").catch((e) => setStatus(String(e), true));
      });

      const box = document.getElementById("remoteBox");
      document.getElementById("btnRemote").addEventListener("click", () => {
        if (!tauri) return;
        box.classList.add("open");
        document.getElementById("hostUrl").focus();
      });

      box.addEventListener("submit", (ev) => {
        ev.preventDefault();
        if (!tauri) return;
        const url = document.getElementById("hostUrl").value.trim();
        if (!url) return;
        setStatus("Connecting…");
        tauri.core.invoke("pick_remote", { url }).catch((e) => setStatus(String(e), true));
      });
    </script>
  </body>
</html>
