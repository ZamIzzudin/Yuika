<!doctype html>
<!-- Yuika Desktop onboarding (P2-DTL-1, D48 redesign). Vanilla (tanpa React):
     halaman pertama shell Tauri (apps/desktop), window.__TAURI__ di-inject
     shell (withGlobalTauri). Dibuka di browser biasa → fallback link ke app.
     Desain mengikuti app: canvas #1a1a1a, surface #212121, aksen #007cf7,
     oval konsentris ala CharacterStage/AuthGate, maskot logo melayang. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome to Yuika</title>
    <style>
      :root {
        --canvas: #1a1a1a;
        --surface: #212121;
        --inset: #101010;
        --line: #2e2e2e;
        --line-strong: #3d3d3d;
        --primary: #f2f2f2;
        --muted: #9a9a9a;
        --dim: #7a7a7a;
        --accent: #007cf7;
        --accent-hover: #3394f9;
        --danger: #ff6069;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--canvas);
        color: var(--primary);
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 32px;
        overflow: hidden;
      }
      /* oval konsentris ala login gate (identitas visual konsisten) */
      .ovals { position: fixed; inset: 0; pointer-events: none; }
      .ovals i {
        position: absolute;
        top: 46%;
        left: 50%;
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }
      .ovals i:nth-child(1) { height: 520px; width: min(880px, 92vw); border: 1px solid rgb(46 46 46 / 0.7); }
      .ovals i:nth-child(2) { height: 360px; width: min(640px, 70vw); border: 1px dashed rgb(46 46 46 / 0.6); }
      .ovals i:nth-child(3) { height: 230px; width: min(420px, 46vw); border: 1px solid rgb(46 46 46 / 0.85); }

      .wrap { position: relative; width: 100%; max-width: 620px; text-align: center; }
      .mascot {
        width: 120px;
        height: 120px;
        margin: 0 auto 14px;
        border-radius: 999px;
        background: var(--inset);
        border: 1px solid var(--line);
        object-fit: cover;
        animation: floaty 6s var(--ease) infinite alternate;
        box-shadow: 0 18px 50px -18px rgb(0 124 247 / 0.35);
      }
      @keyframes floaty {
        from { transform: translateY(-6px); }
        to { transform: translateY(6px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .mascot { animation: none; }
      }
      h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
      .sub { color: var(--muted); margin-top: 6px; }

      .cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-top: 30px;
        text-align: left;
      }
      @media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }
      .card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px 18px 16px;
        cursor: pointer;
        transition: border-color 160ms var(--ease), transform 160ms var(--ease), background 160ms var(--ease);
        font: inherit;
        color: inherit;
      }
      .card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
        background: #242424;
      }
      .card .ic {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: rgb(0 124 247 / 0.12);
        color: var(--accent);
        margin-bottom: 2px;
      }
      .card b { font-size: 14px; font-weight: 600; }
      .card span { color: var(--muted); font-size: 12.5px; }
      .card .go {
        color: var(--accent);
        font-size: 12px;
        font-weight: 500;
        margin-top: 8px;
      }

      .remote {
        display: none;
        margin-top: 14px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        text-align: left;
      }
      .remote.open { display: block; }
      .remote label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
      .row { display: flex; gap: 8px; }
      input {
        flex: 1;
        background: var(--inset);
        border: 1px solid var(--line-strong);
        border-radius: 9px;
        color: var(--primary);
        font: inherit;
        padding: 8px 12px;
        outline: none;
        min-width: 0;
        transition: border-color 120ms var(--ease);
      }
      input:focus { border-color: var(--accent); }
      button.primary {
        background: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 9px;
        color: #fff;
        font: inherit;
        font-weight: 500;
        padding: 8px 16px;
        cursor: pointer;
        transition: background 120ms var(--ease), border-color 120ms var(--ease);
      }
      button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

      .status { color: var(--muted); font-size: 12px; margin-top: 18px; min-height: 16px; }
      .status.err { color: var(--danger); }
      .status .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 999px;
        border: 2px solid rgb(154 154 154 / 0.3);
        border-top-color: var(--muted);
        animation: spin 0.8s linear infinite;
        vertical-align: -1px;
        margin-right: 7px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      .fallback { display: none; margin-top: 18px; color: var(--dim); font-size: 12px; }
      .fallback a { color: var(--accent); text-decoration: none; }
      .fallback a:hover { text-decoration: underline; }
      body.plain .fallback { display: block; }
      body.plain .cards, body.plain .remote, body.plain .ovals { display: none; }
    </style>
  </head>
  <body>
    <div class="ovals" aria-hidden="true"><i></i><i></i><i></i></div>

    <main class="wrap">
      <img class="mascot" src="android-chrome-512x512.png" alt="" />
      <h1>Welcome to Yuika</h1>
      <p class="sub">Your agentic persona studio. How do you want to run it?</p>

      <div class="cards">
        <button class="card" id="btnHost" type="button">
          <span class="ic" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
              <rect x="1.5" y="2.5" width="13" height="9" rx="1.5" />
              <path d="M5.5 14h5M8 11.5V14" stroke-linecap="round" />
            </svg>
          </span>
          <b>On this device</b>
          <span>Run the full studio locally: engine, projects, and workspace on this machine.</span>
          <span class="go">Start local engine →</span>
        </button>
        <button class="card" id="btnRemote" type="button">
          <span class="ic" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
              <circle cx="8" cy="8" r="6.5" />
              <path d="M1.5 8h13M8 1.5c2 2 2 11 0 13M8 1.5c-2 2-2 11 0 13" />
            </svg>
          </span>
          <b>Connect to a host</b>
          <span>Drive a Yuika instance running on another machine from here.</span>
          <span class="go">Enter host URL →</span>
        </button>
      </div>

      <form class="remote" id="remoteBox" autocomplete="off">
        <label for="hostUrl">Host URL (for example http://192.168.1.20:3000)</label>
        <div class="row">
          <input id="hostUrl" type="url" placeholder="http://" spellcheck="false" />
          <button class="primary" type="submit">Connect</button>
        </div>
      </form>

      <p class="status" id="status" role="status"></p>
      <p class="fallback">
        You opened this page in a browser. Launch the Yuika desktop app to pick a mode, or
        <a href="./">continue in the browser</a>.
      </p>
    </main>

    <script>
      const status = document.getElementById("status");
      const setStatus = (msg, busy) => {
        status.classList.remove("err");
        status.innerHTML = busy ? '<span class="dot"></span>' + msg : msg;
      };
      const setErr = (msg) => {
        status.classList.add("err");
        status.textContent = msg;
      };
      window.__hostError = (msg) => setErr(msg);

      const tauri = window.__TAURI__;
      if (!tauri) document.body.classList.add("plain");

      document.getElementById("btnHost").addEventListener("click", () => {
        if (!tauri) return;
        setStatus("Starting the local engine…", true);
        tauri.core.invoke("pick_host").catch((e) => setErr(String(e)));
      });

      const box = document.getElementById("remoteBox");
      document.getElementById("btnRemote").addEventListener("click", () => {
        if (!tauri) return;
        box.classList.add("open");
        document.getElementById("hostUrl").focus();
      });

      box.addEventListener("submit", (ev) => {
        ev.preventDefault();
        if (!tauri) return;
        const url = document.getElementById("hostUrl").value.trim();
        if (!url) return;
        setStatus("Connecting…", true);
        tauri.core.invoke("pick_remote", { url }).catch((e) => setErr(String(e)));
      });
    </script>
  </body>
</html>
