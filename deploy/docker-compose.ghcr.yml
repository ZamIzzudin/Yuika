# Yuika via GitHub Container Registry - TANPA clone repo, tanpa build.
# Panduan pemakaian: docs/TRY-YUIKA.md (bahasa Indonesia).
#
#   mkdir yuika && cd yuika
#   curl -O https://raw.githubusercontent.com/ZamIzzudin/Yuika/main/deploy/docker-compose.ghcr.yml
#   docker compose -f docker-compose.ghcr.yml up -d
#   # buka http://localhost:3000
#
# Update ke versi terbaru:
#   docker compose -f docker-compose.ghcr.yml pull && \
#   docker compose -f docker-compose.ghcr.yml up -d
#
# Data (sqlite + workspace + vault + auth) hidup di volume yuika-data;
# upgrade image tidak pernah menyentuhnya.
#
# Catatan: web di-build dengan NEXT_PUBLIC_API_BASE=http://127.0.0.1:3211
# (browser harus mengakses dari mesin yang sama). Akses dari HP/mesin lain di
# LAN atau lewat domain publik: ikuti docs/DEPLOY.md (build sendiri + Caddy).

name: yuika

services:
  api:
    image: ghcr.io/zamizzudin/yuika-api:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3211:3211"
    volumes:
      - yuika-data:/data
    environment:
      # Semua opsional; API key model paling gampang diisi lewat UI:
      # Settings -> Provider. Uncomment untuk override:
      # YUI_OPENAI_API_KEY: sk-xxx
      # YUI_MODEL: gpt-4o
      # YUI_MAX_ITER: "48"
      {}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3211/api/auth/me').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  web:
    image: ghcr.io/zamizzudin/yuika-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  yuika-data:
