# Override bawaan Penpot untuk embed tab Design (P2-DSN-3): X-Frame-Options
# SAMEORIGIN dihapus (memblokir iframe lintas origin). CSP report-only bawaan
# tetap jalan; produksi wajib CSP enforce + frame-ancestors origin platform.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
