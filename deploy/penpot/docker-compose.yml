# Penpot self-host untuk Yuika (F3 / P2-DSN infra).
# Turunan docker/images/docker-compose.yaml Penpot 2.18.x (MPL-2.0), disusutkan:
# tanpa mailpit (registrasi tanpa verifikasi email), telemetry off, embed-ready.
# - frontend: http://localhost:9001 ; header X-Frame-Options dilepas via file
#   override (lihat nginx-security-headers.conf) supaya viewer share-link bisa
#   di-iframe dari studio (produksi: ganti origin + CSP enforce).
# - flags: registration + login-with-password + access-tokens (connector RPC)
#   + disable-email-verification + disable-secure-session-cookies (dev http).
# Jalankan: docker compose up -d  (butuh .env: PENPOT_VERSION, PENPOT_SECRET_KEY)
x-flags: &penpot-flags
  PENPOT_FLAGS: login-with-password registration access-tokens disable-email-verification disable-secure-session-cookies enable-prepl-server

x-uri: &penpot-public-uri
  PENPOT_PUBLIC_URI: http://localhost:9001

x-secret: &penpot-secret-key
  PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:?set in .env}

x-database: &penpot-database
  PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
  PENPOT_DATABASE_USERNAME: penpot
  PENPOT_DATABASE_PASSWORD: penpot

networks:
  penpot:

volumes:
  penpot_postgres_v15:
  penpot_assets:

services:
  penpot-frontend:
    image: "penpotapp/frontend:${PENPOT_VERSION}"
    restart: always
    ports:
      - 9001:8080
    volumes:
      - penpot_assets:/opt/data/assets
      # embed tab Design: tanpa X-Frame-Options (file bawaan memuatnya hardcoded)
      - ./nginx-security-headers.conf:/etc/nginx/nginx-security-headers.conf:ro
    depends_on:
      - penpot-backend
    networks:
      - penpot
    environment:
      <<: [*penpot-flags, *penpot-public-uri]
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000

  penpot-backend:
    image: "penpotapp/backend:${PENPOT_VERSION}"
    restart: always
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-valkey:
        condition: service_healthy
    networks:
      - penpot
    environment:
      <<: [*penpot-flags, *penpot-public-uri, *penpot-secret-key, *penpot-database]
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: "false"
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000

  # export PNG/SVG headless (thumbnail artefak, input vision) - opsional tapi murah
  penpot-exporter:
    image: "penpotapp/exporter:${PENPOT_VERSION}"
    restart: always
    depends_on:
      penpot-valkey:
        condition: service_healthy
    networks:
      - penpot
    environment:
      <<: [*penpot-flags, *penpot-secret-key, *penpot-public-uri]
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0

  penpot-admin-console:
    image: "penpotapp/admin-console:${PENPOT_VERSION}"
    restart: always
    depends_on:
      penpot-postgres:
        condition: service_healthy
    networks:
      - penpot
    environment:
      <<: [*penpot-public-uri, *penpot-secret-key, *penpot-database]
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080

  penpot-postgres:
    image: postgres:15
    restart: always
    stop_signal: SIGINT
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 2s
    volumes:
      - penpot_postgres_v15:/var/lib/postgresql/data
    networks:
      - penpot
    environment:
      - POSTGRES_INITDB_ARGS=--data-checksums
      - POSTGRES_DB=penpot
      - POSTGRES_USER=penpot
      - POSTGRES_PASSWORD=penpot

  penpot-valkey:
    image: valkey/valkey:8.1
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - penpot
    environment:
      - VALKEY_EXTRA_FLAGS=--maxmemory 128mb --maxmemory-policy volatile-lfu
